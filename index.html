<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сам себе продюсер за 7 шагов</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
<header><button id="home" class="brand">САМ СЕБЕ ПРОДЮСЕР</button><span id="count"></span><progress max="7" value="0" aria-label="Выполненные шаги"></progress></header>
<main id="screen"></main>
<footer><button id="privacy">Ответы и сохранение</button><p id="status" role="status"></p></footer>
<dialog id="settings"><form method="dialog"><h2>Ответы и сохранение</h2><p>Гайд запоминает ответы и отметки в этом браузере, чтобы вы могли продолжить позже. Кнопка ниже удалит их только с этого устройства. Перед удалением можно скачать карту на итоговом экране.</p><label><input type="checkbox" id="analytics"> Разрешаю отправлять источник и события прохождения для статистики</label><p><a id="policy" hidden>Как используются данные</a></p><p><button type="button" id="reset">Удалить ответы с устройства</button></p><button>Готово</button></form></dialog>
</html>
